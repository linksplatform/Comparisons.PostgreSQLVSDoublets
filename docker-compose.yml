version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: hasura_bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: benchpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2.27.0
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://bench:benchpass@postgres:5432/hasura_bench
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"

volumes:
  pgdata:
