# Configuration for graphql-bench
endpoints:
  - name: postgres-hasura
    url: http://localhost:8080/v1/graphql
    headers:
      X-Hasura-Admin-Secret: ""
  - name: doublets
    url: http://localhost:4000/graphql
    headers: {}

queries:
  - file: queries/simple.graphql
    weight: 1

settings:
  duration: 10s
  connections: 10
  parallelism: 5
